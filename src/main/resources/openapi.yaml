openapi: 3.0.3

info:
  title: API de Gestão de Funcionários
  description: Contrato da API para gerenciamento de funcionários.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Servidor local de referência


paths:
  /funcionarios:
    post:
      summary: Cadastrar funcionário
      description: Cadastra um novo funcionário no sistema.
      operationId: cadastrarFuncionario
      tags:
        - Funcionários
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuncionarioRequest'
      responses:
        '201':
          description: Funcionário cadastrado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Funcionario'
        
        '400':
          description: Dados inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    
    get:
      summary: Listar todos os funcionários
      description: Retorna a lista de funcionários cadastrados.
      operationId: listarFuncionarios
      tags:
        - Funcionários
      responses:
        '200':
          description: Lista de funcionários retornada com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Funcionario'

  /funcionarios/{id}:
    get:
      summary: Buscar funcionário por ID
      description: Retorna os dados de um funcionário pelo seu identificador.
      operationId: buscarFuncionarioPorId
      tags:
        - Funcionários
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador do funcionário.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Funcionário encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Funcionario'
        
        '404':
          description: Funcionário não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Atualizar funcionário
      description: Atualiza os dados de um funcionário existente.
      operationId: atualizarFuncionario
      tags:
        - Funcionários
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador do funcionário.
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuncionarioRequest'
      responses:
        '200':
          description: Funcionário atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Funcionario'
        
        '400':
          description: Dados inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Funcionário não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Excluir funcionário
      description: Remove um funcionário pelo seu identificador.
      operationId: excluirFuncionario
      tags:
        - Funcionários
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador do funcionário.
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Funcionário excluído com sucesso.
        
        '404':
          description: Funcionário não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    FuncionarioRequest:
      type: object
      required:
        - nome
        - designacao
        - salario
        - telefone
        - endereco
      properties:
        nome:
          type: string
          example: Maria Silva
        designacao:
          type: string
          example: Desenvolvedora Java
        salario:
          type: number
          format: double
          example: 4500.00
        telefone:
          type: string
          example: "74999999999"
        endereco:
          type: string
          example: Rua das Flores, 123

    Funcionario:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nome:
          type: string
          example: Maria Silva
        designacao:
          type: string
          example: Desenvolvedora Java
        salario:
          type: number
          format: double
          example: 4500.00
        telefone:
          type: string
          example: "74999999999"
        endereco:
          type: string
          example: Rua das Flores, 123


    ErrorResponse:
      type: object
      properties:
        mensagem:
          type: string
          example: "Funcionário não encontrado com ID: 10"
